<title>Card Binder POC</title>
<style>
/* Layout concept: a toolbar (list/binder toggle + jump-to-pokemon, proving
   the entry point) above a 3D stage. Two STATIC page slots sit side by side;
   a single turning "leaf", hinged at the spine edge of whichever slot is
   turning, swings over to reveal the next/previous page underneath - only
   one page moves at a time, like a real page, not the whole spread rotating
   around a central axis (that read as a water wheel). The ring-and-zipper
   spine is a fixed overlay that never rotates - rings are bolted to the
   binder; pages turn around them. */
:root {
  --bg: #ece6da;
  --fg: #2b2420;
  --muted: #6f6355;
  --accent: #b5542c;
  --leather: #2c2320;
  --leather-hi: #44362f;
  --page: #f7f3e9;
  --page-back: #e3dac8;
  --page-edge: #d8cfbd;
  --pocket-border: #c9bda5;
  --metal-1: #e9ecef;
  --metal-2: #8d96a0;
  --metal-3: #4a515a;
  --card-fallback: #cfe3d8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1812;
    --fg: #ece5d8;
    --muted: #a89a86;
    --accent: #e07a4a;
    --leather: #171310;
    --leather-hi: #2a221c;
    --page: #2a241d;
    --page-back: #231e17;
    --page-edge: #3a3226;
    --pocket-border: #4a4133;
    --metal-1: #cfd4d8;
    --metal-2: #6b7278;
    --metal-3: #2e3338;
    --card-fallback: #294a3c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1812;
  --fg: #ece5d8;
  --muted: #a89a86;
  --accent: #e07a4a;
  --leather: #171310;
  --leather-hi: #2a221c;
  --page: #2a241d;
  --page-back: #231e17;
  --page-edge: #3a3226;
  --pocket-border: #4a4133;
  --metal-1: #cfd4d8;
  --metal-2: #6b7278;
  --metal-3: #2e3338;
  --card-fallback: #294a3c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); margin: 0; }
.app {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  padding: 20px 16px 28px;
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1, .label-face { font-family: 'Fraunces', Georgia, serif; }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
.toolbar-left h1 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 600;
  text-wrap: balance;
}
.toolbar-left .sub {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.85rem;
}
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.jump {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--muted);
}
.jump select {
  font: inherit;
  font-size: 0.85rem;
  color: var(--fg);
  background: var(--page);
  border: 1px solid var(--pocket-border);
  border-radius: 7px;
  padding: 6px 8px;
}
.view-toggle {
  display: inline-flex;
  background: var(--page);
  border: 1px solid var(--pocket-border);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.toggle-btn {
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  min-height: 32px;
}
.toggle-btn.active {
  background: var(--accent);
  color: #fff8f2;
}
.toggle-btn:focus-visible, .nav-btn:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---- "entry point" stub: a plain list, each row has a button that jumps
   straight into the binder at that Pokemon's page, mirroring the real app's
   Cards-tab button. ---- */
.list-view {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--pocket-border);
  border: 1px solid var(--pocket-border);
  border-radius: 10px;
  overflow: hidden;
}
.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--page);
  padding: 10px 14px;
}
.list-row .dex-no { color: var(--muted); font-size: 0.8rem; width: 3.2em; font-variant-numeric: tabular-nums; }
.list-row .dex-name { flex: 1; font-weight: 600; }
.list-row button {
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 7px;
  cursor: pointer;
  min-height: 32px;
}
.list-row button:hover { background: var(--accent); color: #fff8f2; }

/* ---- binder ---- */
.binder-view { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.binder-stage {
  position: relative;
  width: 100%;
  max-width: 820px;
  aspect-ratio: 16 / 10;
  perspective: 2400px;
  touch-action: pan-y;
}
.leather-base {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.18)),
    var(--leather);
  box-shadow: 0 18px 40px -16px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
}

.book {
  position: absolute;
  inset: 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* static slots - these never rotate; only the .leaf on top of one of them does */
.slot {
  position: relative;
  overflow: hidden;
}
.page {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 140% at 10% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 55%),
    var(--page);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3%;
  padding: 6% 6%;
}
.slot.left .page { border-radius: 10px 2px 2px 10px; padding-right: 7%; }
.slot.right .page { border-radius: 2px 10px 10px 2px; padding-left: 7%; }
.page::before {
  /* page-stock edge shadow toward the spine */
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 18px;
}
.slot.left .page::before { right: 0; background: linear-gradient(90deg, rgba(0,0,0,.14), transparent); }
.slot.right .page::before { left: 0; background: linear-gradient(270deg, rgba(0,0,0,.14), transparent); }

/* ---- the turning leaf: hinged at whichever edge sits on the spine ---- */
.leaf {
  position: absolute;
  top: 10px; bottom: 10px;
  width: calc(50% - 10px);
  z-index: 50;
  pointer-events: none;
  display: none;
}
.leaf.active { display: block; }
.leaf-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  overflow: hidden;
}
.leaf-face.back {
  transform: rotateY(180deg);
  background: var(--page-back);
  border-radius: inherit;
}
.leaf-face.back::after {
  /* faint ruled lines, like the blank backing of a sleeve page */
  content: "";
  position: absolute;
  inset: 12%;
  background-image: repeating-linear-gradient(0deg, transparent 0 18%, rgba(0,0,0,.05) 18% 20%);
}
/* a soft bright ridge that rides the fold as the leaf bends, so the turn
   reads as bending paper rather than a rigid card rotating in place */
.leaf-fold {
  position: absolute;
  top: 0; bottom: 0;
  width: 16%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  mix-blend-mode: screen;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
  transform: translateX(-50%);
}
.leaf-shade {
  /* darkens as the leaf rotates past 90deg, like light raking a turning page */
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

.pocket {
  position: relative;
  border-radius: 8px;
  border: 1px solid var(--pocket-border);
  background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,0) 30%);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.18), inset 0 -1px 0 rgba(255,255,255,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.pocket.empty { border-style: dashed; opacity: .45; background: transparent; box-shadow: none; }

.card {
  position: absolute;
  inset: 6%;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 7% 8%;
  color: #fff;
  font-size: 0.62rem;
  line-height: 1.15;
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.card .no { font-variant-numeric: tabular-nums; opacity: .85; font-size: .62em; }
.card .name { font-weight: 700; font-size: 0.78em; text-wrap: balance; }
.card .hp { align-self: flex-end; font-size: .62em; background: rgba(0,0,0,.25); border-radius: 4px; padding: 1px 5px; }
/* ---- the "in the sleeve" look: a fixed diagonal glare + a faint cool tint,
   layered over every card so it reads as plastic, not bare card art. ---- */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 60%, rgba(255,255,255,.18) 78%, rgba(255,255,255,0) 92%),
    linear-gradient(180deg, rgba(190,210,230,.10), rgba(190,210,230,.04));
  mix-blend-mode: screen;
  pointer-events: none;
}
.card.v2::after { background-position: 10% 0; }

/* ---- fixed ring + zipper spine, never rotates with the pages ---- */
.spine {
  position: absolute;
  top: 2%;
  bottom: 2%;
  left: 50%;
  width: 34px;
  margin-left: -17px;
  z-index: 500;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 6% 0;
}
.spine::before {
  content: "";
  position: absolute;
  inset: -2% -10px;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35));
}
.zip-track {
  position: absolute;
  top: 4%; bottom: 4%;
  left: 50%;
  width: 7px;
  margin-left: -3.5px;
  background: repeating-linear-gradient(0deg, var(--metal-3) 0 3px, var(--metal-2) 3px 6px);
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.3);
}
.zip-pull {
  position: absolute;
  left: 50%;
  top: 46%;
  width: 16px;
  height: 22px;
  margin-left: -8px;
  background: linear-gradient(180deg, var(--metal-1), var(--metal-3));
  border-radius: 5px;
  box-shadow: 0 2px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.6);
}
.zip-pull::after {
  content: "";
  position: absolute;
  left: 50%; top: -7px;
  width: 9px; height: 9px;
  margin-left: -4.5px;
  border-radius: 50%;
  border: 2.5px solid var(--metal-2);
}
.ring {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, #fff, var(--metal-1) 30%, var(--metal-2) 62%, var(--metal-3) 100%);
  box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 7px var(--leather);
  position: relative;
  z-index: 2;
}
.ring::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,.35);
}

.controls {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--pocket-border);
  background: var(--page);
  color: var(--fg);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.nav-btn:disabled { opacity: .35; cursor: default; }
.pageIndicator { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9em; text-align: center; }
.hint { margin: 0; font-size: 0.78rem; color: var(--muted); text-align: center; }

@media (max-width: 480px) {
  .ring { width: 22px; height: 22px; }
  .spine { width: 26px; margin-left: -13px; }
  .card { font-size: 0.56rem; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">

<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <h1>Card binder</h1>
      <p class="sub">Proof of concept — look &amp; page-turn feel, not wired to real data</p>
    </div>
    <div class="toolbar-right">
      <label class="jump">
        Jump to
        <select id="jumpSelect" aria-label="Jump to a Pokemon's page"></select>
      </label>
      <div class="view-toggle" role="group" aria-label="View">
        <button class="toggle-btn" id="viewListBtn" type="button">List</button>
        <button class="toggle-btn active" id="viewBinderBtn" type="button">Binder</button>
      </div>
    </div>
  </div>

  <section class="list-view" id="listView" hidden></section>

  <section class="binder-view" id="binderView">
    <div class="binder-stage" id="stage">
      <div class="leather-base"></div>
      <div class="book">
        <div class="slot left" id="leftSlot"></div>
        <div class="slot right" id="rightSlot"></div>
      </div>
      <div class="leaf" id="leaf">
        <div class="leaf-face front" id="leafFront"></div>
        <div class="leaf-face back" id="leafBack"></div>
        <div class="leaf-shade" id="leafShade"></div>
        <div class="leaf-fold" id="leafFold"></div>
      </div>
      <div class="spine" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="zip-track"></div>
        <div class="zip-pull"></div>
      </div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="Previous page" type="button">‹</button>
      <div class="pageIndicator" id="pageIndicator"></div>
      <button class="nav-btn" id="nextBtn" aria-label="Next page" type="button">›</button>
    </div>
    <p class="hint">Drag a page left or right, or use the arrows, to turn.</p>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---- sample data: grouped by "pokemon" so a jump target lands on a real page ----
  var TYPE_COLORS = {
    grass: "#4c9a5a", fire: "#d9622b", water: "#2f7fb8",
    electric: "#c79a1e", psychic: "#b24f86", normal: "#8a8470"
  };
  var POKEMON = [
    { name: "Bulbasaur", no: 1, type: "grass", cards: 2 },
    { name: "Charmander", no: 4, type: "fire", cards: 3 },
    { name: "Squirtle", no: 7, type: "water", cards: 1 },
    { name: "Pikachu", no: 25, type: "electric", cards: 4 },
    { name: "Clefairy", no: 35, type: "normal", cards: 2 },
    { name: "Abra", no: 63, type: "psychic", cards: 1 },
    { name: "Vulpix", no: 37, type: "fire", cards: 2 },
    { name: "Psyduck", no: 54, type: "water", cards: 3 },
    { name: "Oddish", no: 43, type: "grass", cards: 2 }
  ];

  var allCards = [];
  POKEMON.forEach(function (p) {
    for (var i = 1; i <= p.cards; i++) {
      allCards.push({ name: p.name, no: p.no, type: p.type, hp: 60 + (i * 15) % 90, variant: i });
    }
  });

  var PER_PAGE = 9;
  var pages = [];
  for (var i = 0; i < allCards.length; i += PER_PAGE) {
    pages.push(allCards.slice(i, i + PER_PAGE));
  }
  var pageCount = pages.length;

  function pageIndexForPokemon(no) {
    var cardIndex = allCards.findIndex(function (c) { return c.no === no; });
    if (cardIndex === -1) return 0;
    return Math.floor(cardIndex / PER_PAGE);
  }

  function cardEl(card) {
    var wrap = document.createElement("div");
    wrap.className = "pocket";
    if (!card) { wrap.className += " empty"; return wrap; }
    var face = document.createElement("div");
    face.className = "card" + (card.variant % 2 === 0 ? " v2" : "");
    face.style.background = "linear-gradient(160deg, " + (TYPE_COLORS[card.type] || "#607d8b") + ", rgba(0,0,0,.35))";
    face.innerHTML =
      '<span class="no">#' + String(card.no).padStart(3, "0") + "</span>" +
      '<span class="name">' + card.name + (card.variant > 1 ? " · " + card.variant : "") + "</span>" +
      '<span class="hp">HP ' + card.hp + "</span>";
    wrap.appendChild(face);
    return wrap;
  }

  function pageHTML(pageIndex) {
    var container = document.createElement("div");
    container.className = "page";
    var cards = pages[pageIndex] || [];
    for (var s = 0; s < PER_PAGE; s++) {
      container.appendChild(cardEl(cards[s]));
    }
    return container;
  }

  function renderSlot(slotEl, pageIndex) {
    slotEl.innerHTML = "";
    if (pageIndex < 0 || pageIndex >= pageCount) return; // closed cover - blank
    slotEl.appendChild(pageHTML(pageIndex));
  }

  var leftSlot = document.getElementById("leftSlot");
  var rightSlot = document.getElementById("rightSlot");
  var leaf = document.getElementById("leaf");
  var leafFront = document.getElementById("leafFront");
  var leafBack = document.getElementById("leafBack");
  var leafShade = document.getElementById("leafShade");
  var leafFold = document.getElementById("leafFold");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var pageIndicator = document.getElementById("pageIndicator");

  // `current` = the page index shown on the RIGHT. Left shows current - 1.
  var current = 1;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SETTLE_MS = reduceMotion ? 1 : 460;

  function renderStatic() {
    renderSlot(leftSlot, current - 1);
    renderSlot(rightSlot, current);
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= pageCount - 1;
    pageIndicator.textContent = "Page " + (current + 1) + " of " + pageCount;
  }

  var hingeOnLeft = true; // which edge of the leaf is pinned to the spine
  var leafAngle = 0;      // last angle applied, so settle can tween from it

  // Paper, not a rigid card: as the leaf turns, it narrows (foreshortening,
  // like looking at a bending sheet edge-on), picks up a small skew, and the
  // free (unhinged) corner rounds outward mid-turn like it's lifting off the
  // page under it - peaking at 90deg and relaxing back to flat at both ends,
  // the same bell curve already driving the darkening shade.
  function setLeafAngle(angle) {
    leafAngle = angle;
    var progress = Math.min(1, Math.abs(angle) / 180);
    var bell = Math.sin(progress * Math.PI);
    var squeeze = 1 - 0.16 * bell;
    var skewSign = hingeOnLeft ? 1 : -1;
    var skew = skewSign * bell * 1.8;

    leaf.style.transform =
      "rotateY(" + angle + "deg) scaleX(" + squeeze.toFixed(3) + ") skewY(" + skew.toFixed(2) + "deg)";
    leafShade.style.opacity = String(bell * 0.4);

    var curlPx = Math.round(bell * 24);
    var frontFacing = progress < 0.5; // which face the camera currently sees
    var curling = frontFacing ? leafFront : leafBack;
    var resting = frontFacing ? leafBack : leafFront;
    resting.style.borderRadius = "";
    curling.style.borderRadius = hingeOnLeft
      ? "0 " + curlPx + "px " + curlPx + "px 0"
      : curlPx + "px 0 0 " + curlPx + "px";

    leafFold.style.opacity = String(bell * 0.55);
    var foldPos = hingeOnLeft ? 28 + progress * 44 : 72 - progress * 44;
    leafFold.style.left = foldPos + "%";
  }

  // Tweens the leaf from its current angle to a target over `ms`, running
  // the same setLeafAngle physics every frame - used for both "settle into
  // place" and "spring back", so the bend/curl/fold apply smoothly instead
  // of only existing while a finger is actively dragging.
  function animateLeaf(toAngle, ms, onDone) {
    var fromAngle = leafAngle;
    if (reduceMotion || ms <= 0 || fromAngle === toAngle) {
      setLeafAngle(toAngle);
      if (onDone) onDone();
      return;
    }
    var start = performance.now();
    function ease(t) { return 1 - Math.pow(1 - t, 3); }
    function step(now) {
      var t = Math.min(1, (now - start) / ms);
      setLeafAngle(fromAngle + (toAngle - fromAngle) * ease(t));
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  var turn = null; // { dir: 'fwd'|'back' }

  // Positions the leaf exactly over the slot being turned, hinged at the
  // spine-side edge of that slot, front face = that slot's current content,
  // and optimistically swaps the static slot underneath to what will be
  // revealed - so the leaf starts out visually indistinguishable from the
  // slot it's covering.
  function startTurn(dir) {
    if (dir === "fwd" && current >= pageCount - 1) return false;
    if (dir === "back" && current <= 0) return false;
    turn = { dir: dir };
    leafFront.innerHTML = "";
    hingeOnLeft = dir === "fwd";
    if (dir === "fwd") {
      leaf.style.left = "50%";
      leaf.style.right = "";
      leaf.style.transformOrigin = "left center";
      leafFront.appendChild(pageHTML(current));
      renderSlot(rightSlot, current + 1); // reveal-in-progress
    } else {
      leaf.style.right = "50%";
      leaf.style.left = "";
      leaf.style.transformOrigin = "right center";
      leafFront.appendChild(pageHTML(current - 1));
      renderSlot(leftSlot, current - 2); // reveal-in-progress
    }
    setLeafAngle(0);
    leaf.classList.add("active");
    return true;
  }

  function finishTurn(committed) {
    if (!turn) return;
    var dir = turn.dir;
    var target = committed ? (dir === "fwd" ? -180 : 180) : 0;
    animateLeaf(target, SETTLE_MS, function () {
      leaf.classList.remove("active");
      setLeafAngle(0);
      if (committed) current = dir === "fwd" ? current + 1 : current - 1;
      renderStatic(); // authoritative repaint from `current`, fixes any optimistic guess
      turn = null;
    });
  }

  function clickTurn(dir) {
    if (!startTurn(dir)) return;
    finishTurn(true);
  }
  prevBtn.addEventListener("click", function () { clickTurn("back"); });
  nextBtn.addEventListener("click", function () { clickTurn("fwd"); });

  // ---- drag-to-turn ----
  var drag = null; // { startX, width, lastAngle }
  var stage = document.getElementById("stage");
  stage.addEventListener("pointerdown", function (e) {
    var withinRight = e.clientX - stage.getBoundingClientRect().left > stage.clientWidth / 2;
    var dir = withinRight ? "fwd" : "back";
    if (!startTurn(dir)) return;
    drag = { dir: dir, startX: e.clientX, width: stage.clientWidth, lastAngle: 0 };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.startX;
    var progress = Math.max(0, Math.min(1, Math.abs(dx) / (drag.width * 0.5)));
    var angle;
    if (drag.dir === "fwd") {
      // only leftward dragging advances a forward turn
      angle = dx < 0 ? -progress * 180 : 0;
    } else {
      angle = dx > 0 ? progress * 180 : 0;
    }
    drag.lastAngle = angle;
    setLeafAngle(angle);
  });
  function endDrag() {
    if (!drag) return;
    var committed = Math.abs(drag.lastAngle) > 90;
    finishTurn(committed);
    drag = null;
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  function goTo(targetPage) {
    current = Math.max(0, Math.min(pageCount - 1, targetPage));
    renderStatic();
  }

  // ---- jump-to control ----
  var jumpSelect = document.getElementById("jumpSelect");
  POKEMON.forEach(function (p) {
    var opt = document.createElement("option");
    opt.value = String(p.no);
    opt.textContent = "#" + String(p.no).padStart(3, "0") + " " + p.name;
    jumpSelect.appendChild(opt);
  });
  jumpSelect.addEventListener("change", function () {
    goTo(pageIndexForPokemon(Number(jumpSelect.value)));
  });

  // ---- list/binder toggle (stub for the real entry point) ----
  var listView = document.getElementById("listView");
  var binderView = document.getElementById("binderView");
  var viewListBtn = document.getElementById("viewListBtn");
  var viewBinderBtn = document.getElementById("viewBinderBtn");
  POKEMON.forEach(function (p) {
    var row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML =
      '<span class="dex-no">#' + String(p.no).padStart(3, "0") + "</span>" +
      '<span class="dex-name">' + p.name + "</span>" +
      '<button type="button">Open in binder</button>';
    row.querySelector("button").addEventListener("click", function () {
      setView("binder");
      goTo(pageIndexForPokemon(p.no));
    });
    listView.appendChild(row);
  });
  function setView(which) {
    var toBinder = which === "binder";
    listView.hidden = toBinder;
    binderView.hidden = !toBinder;
    viewListBtn.classList.toggle("active", !toBinder);
    viewBinderBtn.classList.toggle("active", toBinder);
  }
  viewListBtn.addEventListener("click", function () { setView("list"); });
  viewBinderBtn.addEventListener("click", function () { setView("binder"); });

  renderStatic();
})();
</script>
